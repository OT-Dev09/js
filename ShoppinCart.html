<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    
</head>
<body onload="displayItem()">
    <div class="col-9 col-lg-6 col-md-5 mx-auto mt-4 shadow p-4 rounded">
        <h1 class="text-center text-decoration-underline py-3">Mini Shopping Cart</h1>
        <input id="input" type="text" placeholder="Enter your item here" class="form-control form-control-none shadow-none">
        <button onclick="addItem()" class="w-100 btn btn-success mt-3">Add Item</button>
        <button onclick="deleteLast()" class="w-100 btn btn-danger mt-3">Delete Item</button>
        <button onclick="deleteAll()" class="w-100 btn btn-danger mt-3">Delete All</button>
    </div>
    <div id="display" class="text-center mt-2">Your Item will show here</div>

    <script src="shopping.js"></script>
</body  >
</html>
